[project]
name = "slimdash"
version = "0.1.0"
description = "A secure, reusable modular-monolith dashboard starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "authlib>=1.6.4,<2",
  "envbind>=1.0.5,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slimdash"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=slimdash --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/slimdash/__main__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "EM101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D102", "D103", "D107", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["slimdash"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
